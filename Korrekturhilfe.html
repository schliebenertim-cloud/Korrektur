<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korrekturhilfe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f2fb;--card:#fff;--ink:#1f2140;--mut:#6b6f8f;--line:#e2e1f2;--pen:#e8553d;--ok:#1fb58f;--acc:#4b3fd1;--acc2:#7a4fe0;--sun:#ffc83d;--accfg:#fff;--in:#f7f6fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14152a;--card:#1d1f3b;--ink:#ecebff;--mut:#a3a6cc;--line:#32355c;--pen:#ff7a62;--ok:#43d9b1;--acc:#8d83ff;--acc2:#b48cff;--accfg:#14152a;--in:#16172f}}
:root[data-theme="dark"]{--bg:#14152a;--card:#1d1f3b;--ink:#ecebff;--mut:#a3a6cc;--line:#32355c;--pen:#ff7a62;--ok:#43d9b1;--acc:#8d83ff;--acc2:#b48cff;--accfg:#14152a;--in:#16172f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.hd{background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;padding:22px 16px 56px}
.hd div{max-width:820px;margin:0 auto}
.hd h1{margin:0;font-size:26px;font-weight:800}.hd span{opacity:.85;font-size:14px}
main{max-width:820px;margin:-40px auto 0;padding:0 14px 60px}
nav{display:flex;gap:6px;margin-bottom:16px;background:var(--card);padding:6px;border-radius:14px;box-shadow:0 4px 18px rgba(40,30,120,.15)}
nav button{flex:1;background:none;border:0;padding:10px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-radius:10px}
nav button[aria-selected="true"]{background:var(--acc);color:var(--accfg)}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;border-top:4px solid var(--acc);box-shadow:0 2px 10px rgba(40,30,120,.08)}
.card.y{border-color:var(--sun)}.card.g{border-color:var(--ok)}.card.r{border-color:var(--pen)}
h2{font-size:17px;margin:0 0 10px;font-weight:800}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input[type=text],select{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--in);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
button.p{background:linear-gradient(120deg,var(--acc),var(--acc2));color:var(--accfg);border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer}
button.s{background:var(--in);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer}
button.x{background:none;border:0;color:var(--pen);cursor:pointer;font-size:18px;padding:2px 8px}
.row{display:grid;grid-template-columns:84px 1fr 80px auto 34px;gap:8px;align-items:center;margin-bottom:8px}
.row .chk{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);white-space:nowrap}
.two{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.hint{color:var(--mut);font-size:14px;margin:8px 0 0}
.who{color:var(--mut)}
.big{font-size:30px;font-weight:800;margin:2px 0}
.bigin{width:100%;font:inherit;font-size:46px;font-weight:800;padding:10px 14px;border:3px solid var(--acc);border-radius:14px;background:var(--in);color:var(--ink)}
.err{color:var(--pen);min-height:24px;margin-top:6px;font-weight:800}
.dots{display:flex;gap:5px;margin:14px 0}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.d{background:var(--ok)}.dots i.c{background:var(--sun)}
.pct{font-size:68px;font-weight:800;line-height:1.1}
.chip{display:inline-block;padding:2px 12px;border-radius:99px;color:#fff;font-weight:800}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:var(--in);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:22px;font-weight:800}.tile small{color:var(--mut)}
.bar{display:grid;grid-template-columns:70px 1fr 36px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.bar div{height:18px;background:var(--in);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:600}
th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#msg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;margin-bottom:12px;font-weight:600}
.ban{background:var(--in);border:2px dashed var(--pen);border-radius:12px;padding:12px;margin-bottom:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="hd"><div><h1 id="ttl">Korrekturhilfe</h1><span>Punkte tippen, Enter drücken, fertig</span></div></header>
<main>
<nav role="tablist"><button role="tab" data-v="test">Test</button><button role="tab" data-v="grade">Korrigieren</button><button role="tab" data-v="calc">Rechner</button><button role="tab" data-v="res">Auswertung</button></nav>
<div id="msg" role="status" hidden></div>
<div id="v"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
</main>
<script>
(function(){
var KEY="korrektur-v1",DEF=[92,81,67,50,30],GC=["#1fb58f","#7cc243","#d9a800","#f08a24","#e8553d","#b3261e"];
var S={title:"Mein Test",tasks:[{max:6,bonus:false},{max:8,bonus:false},{max:10,bonus:false},{max:6,bonus:false},{max:2,bonus:true}],results:[],cls:"",auto:false,scale:DEF.slice()};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.tasks){S=o}}}catch(e){}
if(!S.scale||S.scale.length!==5)S.scale=DEF.slice();if(!S.results)S.results=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var view="test",G=null,clr=false,flt="",srt="time",pend=null,DL=null,mt;
var $=function(s){return document.querySelector(s)},V=$("#v");
try{if(window.claude&&claude.use)claude.use("downloads").then(function(d){DL=d;if(view==="res")rRes()},function(){})}catch(e){}
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var f=function(n){return Number(n).toLocaleString("de-DE",{maximumFractionDigits:2})};
var sum=function(a){return a.reduce(function(x,y){return x+y},0)};
function note(t){var m=$("#msg");m.textContent=t;m.hidden=false;clearTimeout(mt);mt=setTimeout(function(){m.hidden=true},5000)}
function names(){var a=0,z=0;return S.tasks.map(function(t){return t.bonus?"Zusatz "+(++z):"Aufgabe "+(++a)})}
function maxReg(){return sum(S.tasks.map(function(t){return t.bonus?0:t.max}))}
function maxBonus(){return sum(S.tasks.map(function(t){return t.bonus?t.max:0}))}
function pct(t){var m=maxReg();return m>0?Math.round(t/m*1000)/10:0}
function grade(p){for(var i=0;i<5;i++)if(p>=S.scale[i])return i+1;return 6}
function num(v){return /^\s*\d*[.,]?\d*\s*$/.test(v)&&/\d/.test(v)?parseFloat(v.replace(",",".")):NaN}
function chip(p){var g=grade(p);return '<span class="chip" style="background:'+GC[g-1]+'">'+g+'</span>'}

function parts(){var P=[];S.tasks.forEach(function(t,i){var n=t.part||"",l=P[P.length-1];if(l&&l.name===n)l.idx.push(i);else P.push({name:n,idx:[i]})});return P}
function hasParts(){return S.tasks.some(function(t){return t.part})}
function endsPart(i){return i+1<S.tasks.length&&(S.tasks[i].part||"")!==(S.tasks[i+1].part||"")}
function pp(p,pts){var m=function(i){return S.tasks[i].max};return{got:sum(p.idx.map(function(i){return pts[i]||0})),max:sum(p.idx.map(function(i){return S.tasks[i].bonus?0:m(i)})),bonus:sum(p.idx.map(function(i){return S.tasks[i].bonus?m(i):0}))}}
function lp(){var l=S.tasks[S.tasks.length-1];return l&&l.part||""}
function ptab(R){if(!hasParts()||!R.length)return"";return'<div class="card y"><h2>Teilauswertung</h2><div class="sc"><table><tr><th>Teil</th><th>Aufgaben</th><th>Max.</th><th>Ø Punkte</th><th>Quote</th><th>Min.</th><th>Best</th></tr>'+parts().map(function(p){var v=R.map(function(r){return pp(p,r.pts).got}),m=pp(p,[]).max,a=sum(v)/v.length;return'<tr><td>'+esc(p.name||"ohne Teil")+'</td><td>'+p.idx.length+'</td><td>'+f(m)+'</td><td>'+f(a)+'</td><td style="font-weight:800">'+f(m?a/m*100:0)+' %</td><td>'+f(Math.min.apply(0,v))+'</td><td>'+f(Math.max.apply(0,v))+'</td></tr>'}).join("")+'</table></div></div>'}
function pv(v){var m=/^\s*(\d+(?:[.,]\d*)?|[.,]\d+)\s*(?:\+\s*(\d+(?:[.,]\d*)?|[.,]\d+))?\s*$/.exec(v);if(!m)return null;var n=function(s){return parseFloat(s.replace(",","."))};return{x:n(m[1]),y:m[2]?n(m[2]):0,p:!!m[2]}}
function fv(i){var y=(G.bon&&G.bon[i])||0,x=G.pts[i]-y,s=function(n){return String(Math.round(n*100)/100).replace(".",",")};return s(x)+(y?"+"+s(y):"")}
function bs(r){return sum(S.tasks.map(function(t,i){return t.bonus?(r.pts[i]||0):((r.bon&&r.bon[i])||0)}))}
/* Statistik */
function st(L){var n=L.length;if(!n)return null;var p=L.map(function(r){return r.pct}).sort(function(a,b){return a-b});
 var g=L.map(function(r){return grade(r.pct)}),d=[0,0,0,0,0,0];g.forEach(function(x){d[x-1]++});
 return{n:n,avg:sum(p)/n,med:n%2?p[(n-1)/2]:(p[n/2-1]+p[n/2])/2,min:p[0],max:p[n-1],ga:sum(g)/n,dist:d,pass:g.filter(function(x){return x<=4}).length,pts:sum(L.map(function(r){return r.total}))/n}}
function ts(L){return S.tasks.map(function(t,i){var v=L.map(function(r){return r.pts[i]||0}),a=sum(v)/v.length;
 return{avg:a,rate:t.max?a/t.max*100:0,min:Math.min.apply(0,v),max:Math.max.apply(0,v),full:L.filter(function(r){return(r.pts[i]||0)-((r.bon&&r.bon[i])||0)>=t.max}).length,zero:v.filter(function(x){return x===0}).length}})}
function cur(){var L=S.results.map(function(r,i){return{r:r,i:i}}).filter(function(x){return!flt||x.r.cls===flt});
 if(srt==="name")L.sort(function(a,b){return a.r.name.localeCompare(b.r.name,"de")});else if(srt==="pct")L.sort(function(a,b){return b.r.pct-a.r.pct});return L}

function go(v){view=v;document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.v===v)});
 $("#ttl").textContent=S.title||"Korrekturhilfe";if(v==="test")rTest();else if(v==="grade")rGrade();else if(v==="calc")rCalc();else rRes()}

/* Test */
function rTest(){var nm=names();
 V.innerHTML='<div class="card"><label for="tt">Name des Tests</label><input type="text" id="tt" value="'+esc(S.title)+'"></div>'+
 '<div class="card y"><h2>Aufgaben und Punkte</h2><div id="rows"></div><button class="s" id="add">Aufgabe hinzufügen</button> <button class="s" id="addb">Zusatzaufgabe hinzufügen</button> <button class="s" id="addp">Neuen Teil beginnen</button><p class="hint" id="sum"></p><p class="hint">Teile: Aufeinanderfolgende Aufgaben mit demselben Teilnamen (zum Beispiel „Teil A“) bilden einen Teil. Nach der letzten Aufgabe eines Teils zeigt die Korrektur die erreichten Punkte dieses Teils, bevor es weitergeht. Das Feld leer lassen, wenn der Test keine Teile hat.</p></div>'+
 '<div class="card g"><h2>Notenschlüssel</h2><div class="scale" id="sc"></div><p class="hint">Mindestprozent für jede Note. Darunter gibt es eine 6. Änderungen wirken sich auch auf schon korrigierte Arbeiten aus.</p></div>'+
 '<button class="p" id="go">Mit dem Korrigieren beginnen</button>';
 var rows=$("#rows");
 S.tasks.forEach(function(t,i){var d=document.createElement("div");d.className="row";
  d.innerHTML='<span>'+nm[i]+'</span><input type="text" class="pt" placeholder="Teil" aria-label="Teil für '+nm[i]+'" value="'+esc(t.part||"")+'"><input type="text" class="mx" inputmode="decimal" value="'+f(t.max)+'" aria-label="Höchstpunkte '+nm[i]+'"><label class="chk"><input type="checkbox"'+(t.bonus?" checked":"")+'> Zusatz</label><button class="x" aria-label="Löschen">×</button>';
  var pt=d.querySelector("input.pt");pt.oninput=function(){t.part=pt.value.trim();save()};if(i>0&&(S.tasks[i-1].part||"")!==(t.part||""))d.style.cssText="margin-top:14px;border-top:2px solid var(--line);padding-top:10px";var inp=d.querySelector("input.mx");inp.oninput=function(){var n=num(inp.value);if(!isNaN(n)){t.max=n;save();sm()}};
  d.querySelector("input[type=checkbox]").onchange=function(e){t.bonus=e.target.checked;save();rTest()};
  d.querySelector(".x").onclick=function(){S.tasks.splice(i,1);save();rTest()};rows.appendChild(d)});
 function sm(){$("#sum").textContent="Höchstpunktzahl: "+f(maxReg())+" Punkte"+(maxBonus()?" (plus "+f(maxBonus())+" Zusatzpunkte)":"")+". Die Prozentzahl bezieht sich auf die Höchstpunktzahl ohne Zusatz."}sm();
 S.scale.forEach(function(v,i){var d=document.createElement("div");d.innerHTML='<label>Note '+(i+1)+' ab %</label><input type="text" inputmode="decimal" value="'+f(v)+'">';
  d.querySelector("input").oninput=function(e){var n=num(e.target.value);if(!isNaN(n)){S.scale[i]=n;save()}};$("#sc").appendChild(d)});
 $("#tt").oninput=function(e){S.title=e.target.value;save();$("#ttl").textContent=S.title||"Korrekturhilfe"};
 $("#add").onclick=function(){S.tasks.push({max:5,bonus:false,part:lp()});save();rTest()};
 $("#addb").onclick=function(){S.tasks.push({max:2,bonus:true,part:lp()});save();rTest()};
 $("#addp").onclick=function(){if(!hasParts())S.tasks.forEach(function(t){t.part="Teil A"});S.tasks.push({max:5,bonus:false,part:"Teil "+String.fromCharCode(65+parts().length)});save();rTest()};
 $("#go").onclick=function(){go("grade")}}

/* Korrigieren */
function rGrade(){
 if(!S.tasks.length){V.innerHTML='<div class="card r">Lege zuerst im Reiter „Test“ mindestens eine Aufgabe an.</div>';return}
 if(!G||G.phase==="who")return rWho();if(G.phase==="task")return rTask();if(G.phase==="part")return rPart();rDone()}
function rWho(){G={phase:"who",name:"",cls:S.cls||"",i:0,pts:[],bon:[]};
 V.innerHTML='<div class="card"><div class="two"><div><label for="n">Name</label><input type="text" id="n" autocomplete="off" placeholder="Max Mustermann"></div><div><label for="k">Klasse</label><input type="text" id="k" autocomplete="off" value="'+esc(G.cls)+'" placeholder="8a"></div></div>'+
 '<button class="p" id="st">Korrektur starten</button><p class="hint">Enter springt zum nächsten Feld. Danach genügt es, pro Aufgabe die Punkte zu tippen und Enter zu drücken. Bisher gespeichert: '+S.results.length+' Arbeiten.</p>'+
 '<label class="chk" style="margin-top:14px;color:var(--ink)"><input type="checkbox" id="au"'+(S.auto?" checked":"")+'> Bei eindeutiger Ziffer sofort weiter, ohne Enter (zum Beispiel „7“ bei höchstens 8 Punkten). Nach einer einzelnen Ziffer wird kurz gewartet, damit sich Zusatzpunkte mit „+“ noch eintippen lassen.</label></div>';
 var n=$("#n"),k=$("#k");n.focus();
 n.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();k.focus();k.select()}};
 k.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();start()}};$("#st").onclick=start;
 $("#au").onchange=function(e){S.auto=e.target.checked;save()};
 function start(){if(!n.value.trim()){n.focus();return}G.name=n.value.trim();G.cls=k.value.trim();S.cls=G.cls;save();G.phase="task";rTask()}}
function rTask(){var i=G.i,t=S.tasks[i],nm=names(),run=sum(G.pts.slice(0,G.i));
 var dots=S.tasks.map(function(_,j){return'<i class="'+(j<i?"d":j===i?"c":"")+'"></i>'}).join("");
 V.innerHTML='<div class="card y"><div class="who">'+esc(G.name)+(G.cls?", "+esc(G.cls):"")+'</div><div class="big">'+(t.part?esc(t.part)+", ":"")+nm[i]+'</div><div class="who">höchstens '+f(t.max)+' Punkte'+(t.bonus?" (Zusatz)":", mehr nur als Zusatz mit Plus")+'</div><div class="dots">'+dots+'</div>'+
 '<input type="text" class="bigin" id="p" inputmode="decimal" autocomplete="off" aria-label="Punkte für '+nm[i]+'"><div class="err" id="e" role="alert"></div>'+
 '<p class="hint">Zwischenstand: '+f(run)+' Punkte. Enter bestätigt. Pfeil hoch oder runter wechselt zwischen den Aufgaben, die Rücktaste im leeren Feld geht auch zurück, Esc bricht ab. Zusatzpunkte nur bewusst mit Plus: 5+1 (5 normal, 1 zusätzlich). Mehr als die Höchstpunktzahl wird nur mit Plus akzeptiert, zum Beispiel 5+46.</p></div>';
 var p=$("#p");p.focus();if(G.pts[i]!==undefined){p.value=fv(i);p.select()}
 function err(m){$("#e").textContent=m}
 function store(){var n=pv(p.value);if(!n){err("Bitte eine Zahl eingeben, mit Zusatzpunkten zum Beispiel 5+1.");return false}
  if(t.bonus&&n.p){err("Bei Zusatzaufgaben ist kein Plus nötig.");return false}
  if(n.x>t.max){err("Mehr als "+f(t.max)+" Punkte geht nicht."+(t.bonus?"":" Für mehr bitte Zusatzpunkte mit Plus eintragen, zum Beispiel "+f(t.max)+"+"+f(Math.round((n.x-t.max)*100)/100)+"."));p.select();return false}
  
  G.pts[i]=n.x+n.y;G.bon[i]=n.y;return true}
 function nxt(){if(i+1<S.tasks.length){G.i++;if(endsPart(i)){G.phase="part";rPart()}else rTask()}else finish()}
 function submit(){if(p.value.trim()===""){err("Bitte eine Zahl eingeben.");return}if(store())nxt()}
 function mv(j){if(p.value.trim()!==""&&!store())return;G.i=j;rTask()}
 function fw(){if(i+1>=S.tasks.length)return;if(p.value.trim()!=="")submit();else if(G.pts[i]!==undefined)nxt()}
 p.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();submit()}else if(e.key==="Escape"){G=null;rGrade()}
  else if(e.key==="Backspace"&&p.value===""&&i>0){e.preventDefault();mv(i-1)}
  else if(e.key==="ArrowUp"||(e.key==="ArrowLeft"&&p.selectionStart===0&&p.selectionEnd===0)){e.preventDefault();if(i>0)mv(i-1)}
  else if(e.key==="ArrowDown"||(e.key==="ArrowRight"&&p.selectionStart===p.value.length)){e.preventDefault();fw()}};
 var at;p.oninput=function(){clearTimeout(at);$("#e").textContent="";var v=p.value;if(S.auto&&/^\d$/.test(v)&&+v*10>t.max)at=setTimeout(function(){if(p.isConnected&&p.value===v)submit()},700)}}
function rPart(){var i=G.i-1,p=parts().filter(function(x){return x.idx.indexOf(i)>=0})[0],q=pp(p,G.pts),nx=S.tasks[G.i].part||"nächsten Teil";
 V.innerHTML='<div class="card g"><div class="who">'+esc(G.name)+(G.cls?", "+esc(G.cls):"")+'</div><div class="big">'+esc(p.name||"Teil")+' fertig</div><div class="pct" style="color:var(--ok);font-size:42px">'+f(q.got)+' von '+f(q.max)+' Punkten</div>'+(q.bonus?'<p class="hint">Enthält Zusatzaufgaben mit bis zu '+f(q.bonus)+' Punkten.</p>':'')+'<p class="hint">Gesamt bisher: '+f(sum(G.pts.slice(0,G.i)))+' Punkte.</p><p><button class="p" id="nx">Weiter zu '+esc(nx)+'</button> <button class="s" id="bk">Letzte Aufgabe ändern</button></p><p class="hint">Enter geht weiter, Rücktaste ändert die letzte Aufgabe.</p></div>';
 $("#nx").focus();$("#nx").onclick=function(){document.onkeydown=null;G.phase="task";rTask()};$("#bk").onclick=back;
 document.onkeydown=function(e){if(view!=="grade"||!G||G.phase!=="part"){document.onkeydown=null;return}if(e.key==="Backspace"){e.preventDefault();back()}};
 function back(){document.onkeydown=null;G.phase="task";G.i--;rTask()}}
